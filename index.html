<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramadan Countdown</title>
  <style>
    :root {
      --bg-top: #0b1a33;
      --bg-bottom: #1d3b5c;
      --gold: #e9c46a;
      --text: #f4f1ea;
      --muted: #a9b8cc;
      --card: rgba(255, 255, 255, 0.07);
      --card-border: rgba(233, 196, 106, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      text-align: center;
    }

    .moon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 18px rgba(233, 196, 106, 0.6));
    }

    h1 {
      font-size: clamp(28px, 6vw, 48px);
      color: var(--gold);
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(14px, 3vw, 18px);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-top: 36px;
      width: 100%;
      max-width: 760px;
    }

    .unit {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px 8px;
    }

    .value {
      display: block;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 6px;
      font-size: clamp(11px, 2.4vw, 14px);
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
    }

    .message {
      margin-top: 32px;
      font-size: 22px;
      color: var(--gold);
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .countdown { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="moon">🌙</div>
  <h1>Ramadan Countdown</h1>
  <p class="subtitle">Ramadan is expected to begin on the evening of Sunday, February 7, 2027</p>

  <div class="countdown" id="countdown">
    <div class="unit"><span class="value" id="months">0</span><span class="label">Months</span></div>
    <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
    <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
    <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
  </div>

  <p class="message" id="message" hidden>Ramadan Mubarak! 🌙</p>

  <footer>Counting down to 6:00 PM (your local time) on February 7, 2027. Actual start depends on moon sighting.</footer>

  <script>
    // Evening of Sunday, February 7, 2027 at 6:00 PM local time (month index 1 = February)
    const target = new Date(2027, 1, 7, 18, 0, 0);

    const pad = (n) => String(n).padStart(2, "0");

    function addMonths(date, months) {
      const d = new Date(date);
      d.setMonth(d.getMonth() + months);
      return d;
    }

    function update() {
      const now = new Date();

      if (now >= target) {
        document.getElementById("countdown").hidden = true;
        document.getElementById("message").hidden = false;
        clearInterval(timer);
        return;
      }

      // Count whole calendar months first, then break the remainder into days/hours/minutes/seconds
      let months = 0;
      while (addMonths(now, months + 1) <= target) months++;

      const remaining = target - addMonths(now, months);
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("months").textContent = months;
      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    const timer = setInterval(update, 1000);
    update();
  </script>
</body>
</html>
